services:
  - type: web
    name: watchme-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DEBUG
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: OAUTH_REDIRECT_BASE_URL
        value: "https://watch-me-liard.vercel.app"
      - key: CORS_ORIGINS
        value: '["http://localhost:5173","http://localhost:3000","https://watch-me-liard.vercel.app"]'
