services:
  - type: web
    name: watchme-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["http://localhost:5173","http://localhost:3000","https://watch-me-liard.vercel.app"]'
      - key: OAUTH_REDIRECT_BASE_URL
        value: "https://watch-me-liard.vercel.app"
      # ── Database ──────────────────────────────────────
      - key: POSTGRES_URI
        sync: false
      - key: POSTGRES_URI_SYNC
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # ── Auth ───────────────────────────────────────────
      - key: SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # ── External APIs ──────────────────────────────────
      - key: TMDB_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      # ── Media storage (S3-compatible) ──────────────────
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: CDN_URL
        sync: false
      # ── Optional ───────────────────────────────────────
      - key: MEILISEARCH_URL
        sync: false
      - key: MEILISEARCH_API_KEY
        sync: false
